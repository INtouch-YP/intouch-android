name: Check Pull Request to dev branch

on:
  # Triggers the workflow on push or pull request events but only for the "dev" branch
  pull_request:
    branches: [ "dev", "main" ]

  workflow_dispatch:

jobs:
  check_pull_request:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Run clean script
        run: git reset --hard

      - name: Run clean script 2
        run: ./gradlew clean

      - name: Check status
        run: echo "Check clean status"

      - name: Set failed if clean failed
        if: failure()
        run: echo "::error::Clean failed"

      - name: Run build script
        run: ./gradlew clean :app:assembleProdDebug --no-build-cache

      - name: Check status
        run: echo "Check build status"
      - name: Set failed if build failed
        if: failure()
        run: echo "::error::Build failed"
